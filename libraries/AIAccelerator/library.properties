name=AIAccelerator
version=1.0.0
author=Phil Schatzmann
maintainer=Phil Schatzmann <phil.schatzmann@gmail.com>
sentence=On-chip INT8 dot-product accelerator (integrated from NanoTangAI's dot_product_engine.v).
paragraph=Same compute engine as the standalone NanoTangAI project's SPI-attached TangNanoAccelerator, but wired directly onto this core's own picorv32 bus (gateware/src/ai_accel_bus.v) instead of going through an external SPI link to a second board. Construct with the tile shape, loadWeights() once, then compute() returns the result pointer directly. Multiple instances (each with its own weight tile) can share the one physical engine by time-slicing it.
category=Signal Input/Output
url=https://github.com/pschatzmann/NanoTangAI
architectures=tangnano20k
