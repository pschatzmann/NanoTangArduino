sentence=On-chip INT8 dot-product accelerator (integrated from NanoTangAI's dot_product_engine.v).
paragraph=Same compute engine and host API shape as the standalone NanoTangAI project's SPI-attached TangNanoAccelerator, but wired directly onto this core's own picorv32 bus (gateware/src/ai_accel_bus.v) instead of going through an external SPI link to a second board. No CS pin, no SPI clock, no computeDelayMicros() heuristic - reading a result blocks in hardware until the computation is actually done.
