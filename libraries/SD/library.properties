sentence=Read/write files on the onboard microSD card slot.
paragraph=Vendored, unmodified, from arduino-libraries/SD (GPLv3 - see LICENSE.txt). Talks to the SD card over the NanoTangArduino SPI library (#include <SPI.h>); requires the CS pin shim in cores/tangnano20k/wiring_digital.cpp (pin SS) since this hardware's SPI chip-select is otherwise controlled internally, not via a free GPIO pin. Uses the onboard microSD slot's bus pins, which are the same pins the SPI/Wire libraries repurpose for other devices - don't use more than one of SD/SPI/Wire at a time. See docs/PERIPHERALS.md.
category=Data Storage
url=https://github.com/arduino-libraries/SD
architectures=tangnano20k
depends=SPI
